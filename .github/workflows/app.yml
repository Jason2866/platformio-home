name: App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install node v20
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install Yarn with NPM
      run: npm install -g yarn
    - name: yarn install
    - run: yarn install
    - run: npm install
    - run: npm run lint
    - run: npm run build
